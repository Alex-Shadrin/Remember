name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package
        shell: powershell
        run: .\scripts\build.ps1 -Test -Package
      - uses: actions/upload-artifact@v4
        with:
          name: Remember-windows
          path: dist/Remember-1.0.0-windows.zip
          if-no-files-found: error
